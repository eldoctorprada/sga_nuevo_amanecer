<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Comunicaciones</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="fas fa-graduation-cap"></i> SGA</div>
            <nav>
                <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Inicio</a>
                <a href="comunicaciones.html" class="nav-link active"><i class="fas fa-comments"></i> Comunicaciones</a>
                <a href="#" id="logoutBtn" class="nav-link" style="color: var(--danger); margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div><h1 class="top-bar-title">💬 Comunicaciones Internas</h1></div>
                <button class="btn btn-primary" onclick="abrirModalMensaje()"><i class="fas fa-plus"></i> Nuevo Mensaje</button>
            </header>

            <section class="card">
                <div class="card-header"><h2 class="card-title">📥 Mensajes Recibidos</h2></div>
                <div id="mensajesLista" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <div class="skeleton" style="height: 80px;"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Nuevo Mensaje -->
    <div class="modal-overlay" id="modalMensaje">
        <div class="modal">
            <div class="modal-header"><h3>✉️ Nuevo Mensaje</h3><button class="modal-close" onclick="cerrarModalMensaje()">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Para (ID de usuario destinatario):</label>
                    <select class="form-select" id="destinatario"><option value="">Cargando destinatarios...</option></select>
                </div>
                <div class="form-group"><label>Asunto:</label><input type="text" class="form-input" id="asuntoMensaje"></div>
                <div class="form-group"><label>Mensaje:</label><textarea class="form-textarea" id="contenidoMensaje" rows="5"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="cerrarModalMensaje()">Cancelar</button>
                <button class="btn btn-primary" onclick="enviarMensaje()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function cargarMensajes() {
            const lista = document.getElementById('mensajesLista');
            lista.innerHTML = '<div class="skeleton" style="height: 80px;"></div>';

            const data = await window.api.getMensajesRecibidos();

            if (!data || !data.mensajes) {
                lista.innerHTML = '<p class="text-center">No se pudieron cargar los mensajes.</p>';
                return;
            }

            if (!data.mensajes.length) {
                lista.innerHTML = '<p class="text-center">No tienes mensajes recibidos.</p>';
                return;
            }

            lista.innerHTML = data.mensajes.map(m => {
                const remitente = m.remitente && m.remitente.nombre_completo ? m.remitente.nombre_completo : 'Desconocido';
                const fecha = m.fecha_envio ? new Date(m.fecha_envio).toLocaleString('es-CO') : '';
                return `
                <div style="padding:1rem; border:1px solid var(--border); border-radius:8px; background:${!m.leido ? '#f0f9ff' : 'white'}; cursor:pointer;" onclick="marcarLeido(${m.id_comunicacion})">
                    <div class="flex-between"><strong>${remitente}</strong><small>${fecha}</small></div>
                    <h4 style="margin:0.5rem 0">${m.asunto}</h4>
                    <p style="margin:0; color: var(--text-light);">${m.mensaje}</p>
                    ${!m.leido ? '<span class="badge badge-primary" style="margin-top:0.5rem;">No leído</span>' : ''}
                </div>`;
            }).join('');
        }

        async function marcarLeido(id) {
            await window.api.marcarMensajeLeido(id);
            cargarMensajes();
        }

        async function cargarDestinatarios() {
            const sel = document.getElementById('destinatario');
            const contactos = await window.api.getDirectorio();
            if (contactos && contactos.length) {
                sel.innerHTML = contactos.map(c => `<option value="${c.id_usuario}">${c.nombre_completo} (${c.tipo_usuario})</option>`).join('');
            } else {
                sel.innerHTML = '<option value="">No hay contactos disponibles</option>';
            }
        }

        async function enviarMensaje() {
            const destinatarioId = document.getElementById('destinatario').value;
            const asunto = document.getElementById('asuntoMensaje').value;
            const mensaje = document.getElementById('contenidoMensaje').value;

            if (!destinatarioId || !asunto || !mensaje) {
                alert('Completa destinatario, asunto y mensaje.');
                return;
            }

            const result = await window.api.enviarMensaje(parseInt(destinatarioId), asunto, mensaje);

            if (result.success) {
                alert('✅ Mensaje enviado exitosamente');
                cerrarModalMensaje();
                document.getElementById('asuntoMensaje').value = '';
                document.getElementById('contenidoMensaje').value = '';
                cargarMensajes();
            } else {
                alert(`❌ Error: ${result.data.message || 'No se pudo enviar el mensaje'}`);
            }
        }

        function abrirModalMensaje() {
            cargarDestinatarios();
            document.getElementById('modalMensaje').classList.add('active');
        }
        function cerrarModalMensaje() { document.getElementById('modalMensaje').classList.remove('active'); }

        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); window.api.logout(); });
        cargarMensajes();
    </script>
</body>
</html>
